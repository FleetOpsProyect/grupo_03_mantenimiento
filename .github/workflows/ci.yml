# Ejecuta las validaciones del proyecto cuando se abre o actualiza un PR hacia develop.
name: Continuous Integration (CI)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Cancela una ejecucion anterior del mismo PR para no gastar recursos innecesarios.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Agrupa las comprobaciones necesarias antes de integrar los cambios.
  build-and-verify:
    name: Build, Lint, Test & Coverage
    runs-on: ubuntu-latest

    # Levanta PostgreSQL para que las pruebas de integracion usen una base real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetops_maintenance_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Configura la conexion de pruebas y el token opcional de SonarCloud.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fleetops_maintenance_test
      SPRING_DATASOURCE_USERNAME: test_user
      SPRING_DATASOURCE_PASSWORD: test_password
      FLYWAY_ENABLED: true
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Obtiene todo el historial para que SonarCloud pueda analizar cambios y blame.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Instala la version de Java requerida por el proyecto.
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      # Configura Gradle y reutiliza dependencias almacenadas en cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Permite ejecutar el wrapper de Gradle en el runner de Linux.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Comprueba que el codigo de produccion y de pruebas cumpla Checkstyle.
      - name: 1. Code Style & Linter (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      # Compila el proyecto y ejecuta las pruebas unitarias y de integracion.
      - name: 2. Compile and Run Tests (Unit & Integration)
        run: ./gradlew test --no-daemon

      # Genera el reporte HTML con el porcentaje de cobertura de las pruebas.
      - name: 3. Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport --no-daemon

      # Falla el CI si la cobertura queda por debajo del minimo configurado.
      - name: 4. Verify Minimum Coverage (80% Rule)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      # Envia el codigo y los resultados a SonarCloud cuando existe un token.
      - name: 5. SonarCloud Analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: ./gradlew sonar -Dsonar.token="$SONAR_TOKEN" --no-daemon --info --stacktrace

      # Construye el JAR ejecutable de Spring Boot sin repetir las pruebas.
      - name: 6. Build Executable Boot JAR
        run: ./gradlew bootJar -x test --no-daemon

      # Guarda el reporte de cobertura aunque un paso anterior haya fallado.
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage-report
          path: build/reports/jacocoHtml/
          retention-days: 14

      # Guarda los resultados detallados de JUnit para diagnosticar fallos.
      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-test-results
          path: build/reports/tests/test/
          retention-days: 14
