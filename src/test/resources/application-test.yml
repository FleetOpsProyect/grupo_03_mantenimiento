spring:
  application:
    name: maintenance-service-test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cloud:
    aws:
      region:
        static: us-east-1
      sns:
        enabled: false
      sqs:
        enabled: false

scheduler:
  preventive-inspection:
    cron: "-"
  outbox-relay:
    fixed-delay-ms: 3600000

logging:
  level:
    root: INFO
    co.edu.univalle.fleetops.mantenimiento: DEBUG
    org.testcontainers: INFO
